<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTS Link Загрузчик</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="board.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="logo"><i data-icon="download"></i></span>
    <span class="brand">MTS Link <b>Загрузчик</b></span>
  </header>

  <form class="panel hero" id="form" novalidate>
    <h1>Скачать запись вебинара</h1>
    <p class="lead">Вставьте ссылку на запись — получите звук или видео со всеми участниками.</p>
    <div class="url-row">
      <input type="url" id="url" placeholder="https://my.mts-link.ru/j/…/record-new/…" autocomplete="off" spellcheck="false" autofocus>
      <button class="primary" id="go">Скачать</button>
    </div>
    <div class="preview" id="preview" hidden></div>
    <div class="modes" id="modes" role="radiogroup" aria-label="Что скачать">
      <button type="button" role="radio" data-mode="audio">
        <span class="mode-ic"><i data-icon="music"></i></span>
        <span><b>Аудио</b><small>MP3 · голоса всех участников в одном файле</small></span>
      </button>
      <button type="button" role="radio" data-mode="av">
        <span class="mode-ic"><i data-icon="video"></i></span>
        <span><b>Видео</b><small>MP4 · все камеры на одном экране, со звуком</small></span>
      </button>
    </div>
    <div class="form-err" id="formErr" role="alert"></div>
  </form>

  <section id="activeSec" hidden>
    <h2>Сейчас</h2>
    <div id="active"></div>
  </section>

  <section>
    <h2>Загрузки</h2>
    <div id="history"></div>
  </section>
</div>

<div class="player" id="player">
  <div class="player-in">
    <div class="pt" id="playerTitle"></div>
    <audio id="audio" controls preload="none"></audio>
    <button class="ghost icon" id="playerClose" title="Закрыть"><i data-icon="x"></i></button>
  </div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="viewer-in">
    <div class="viewer-head"><span id="viewerTitle"></span><button class="ghost icon" id="viewerClose" title="Закрыть (Esc)"><i data-icon="x"></i></button></div>
    <video id="video" controls playsinline preload="metadata"></video>
  </div>
</div>
</body>
</html>
