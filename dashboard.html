ul { margin:6px 0 0; padding-left:18px; } li { margin:3px 0; }
code { font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:0 4px; border-radius:4px; }

рана ffmpeg читает из файла `_work/gallery/seg_NNNN.graph` (`osdeps.graph_option`: с ffmpeg 7 — `-/filter_complex`, раньше — `-filter_complex_script`), не из аргумента: рамки говорящих на длинной записи — десятки КБ, а командная строка Windows — 32 767 символов (13.10)", "пауза перед повтором запроса (`hls._pause`) проверяет отмену каждые 0,5 с — «Отменить» не ждёт до 20 с (13.10)", "длительность записи: из API, а если там пусто — по концу самой поздней дорожки; без длительности общий экран отказывает понятной ошибкой, а не `IndexError` (13.10)"], "tasks": [{"red": false, "due": "", "text": "потоков по умолчанию 64 → 256 (`config.DEFAULT_WORKERS`): ×1,9 к 64 потокам, ×2,4 к 2 МБ/с (замер 25.09) — ждёт «да», см. ОТКРЫТО"}, {"red": false, "due": "", "text": "потолок `MAX_WORKERS` 256 оставить: 384 даёт 20% таймаутов, 512 — обрыв (замер 25.09)"}, {"red": false, "due": "", "text": "e2e «Видео + аудио» на длинном потоке: проверить синхрон звука и видео (ffprobe + глазами)"}, {"red": false, "due": "", "text": "проверить определение экрана (`kind=screen`) на записи с демонстрацией экрана"}, {"red": false, "due": "", "text": "проверить отмену на этапе сведения (ffmpeg terminate) и повторный запуск после неё"}, {"red": false, "due": "", "text": "общий экран на записи с демонстрацией экрана: сейчас экран — обычная плитка «Имя (экран)»; раскладка «экран крупно + камеры сбоку» — см. ОТКРЫТО"}, {"red": false, "due": "", "text": "тест конвейера `_plan`/докачки на фейковом HTTP-сервере (сейчас проверено только вживую)"}, {"red": false, "due": "", "text": "тесты на мутации M5 (сегмент без `.part`), M6 (перезапуск не в ту же папку), M7 (граф вне ключа кэша отрезка) — сейчас их не ловит ни один тест (`kanon/pravila/mutations.md`, прогон 27.10)"}], "debt": ["Windows и Linux проверяются только в GitHub Actions (тесты + запуск start.bat / start.sh с нуля); вживую на них загрузку настоящей записи не гоняли (29.09)", "определение экрана — эвристика по модулю `screensharing*` в eventLogs; E обещал; «не спать» и так делает CLI. spec.md: в лимит 200 строк дописан `.bat` (валидатор его уже проверял); roadmap: этап 9 — whisper.cpp по печати 26.09"}, {"date": "13.10", "module": "downloader", "text": "«Отменить» во время повторов ждало до 20 с (пауза без проверки флага) — теперь ≤ 0,5 с; запись без длительности в API: `layout.plan` падал `IndexError` — длительность берётся по дорожкам, а без неё общий экран отказывает понятной ошибкой. Тесты"}, {"date": "13.10", "module": "downloader", "text": "граф фильтров отрезка общего экрана — файлом, а не аргументом (`-/filter_complex`, до ffmpeg 7 — `-filter_complex_script`): после исправления рамки длинная запись на Windows упёрлась бы в 32 767 символов командной строки. Обе формы проверены на 7.1.1; закрыт ❓ от 13.10"}, {"date": "13.10", "module": "server", "text": "`history.json`: поток автосохранения и цикл событий писали через один `history.tmp` — под нагрузкой 151 ошибка на 150 запусков (в жизни редко: запись 5 мс раз в 2 с), после первой автосохранение умирало до перезапуска. Замок на `save()`, автосохранение переживает ошибку диска, «не спать» снимается даже при сбое записи; `/files/{id}/-1` отдавал последний файл — теперь 404. Тесты"}, {"date": "13.10", "module": "server", "text": "сервер отвечал любому `Host`: чужой сайт через подмену DNS на 127.0.0.1 мог читать `/api/jobs` и качать `/files/` (воспроизведено: `Host: evil.example` → 200 со списком задач), а запросом без тела — отменять загрузки. Теперь `local_only`: чужой `Host` или `Origin` → 403; создание задачи с чужого сайта и раньше не проходило (422 / preflight). Тесты"}], "check": {"errors": [], "warnings": []}};

  return `<div class="tiles">${t("Модулей", M.length)}${t("Задач", all(m => m.tasks).length)}
    ${t("🔴 со сроком" + (lateN ? `, просрочено ${lateN}` : ""), reds.length, lateN)}${t("❓ открыто", all(m => m.open).length, all(m => m.open).length)}
    ${t("⏳ ждуны", all(m => m.waiting).length)}${t("Ъ печатей", all(m => m.seals).length)}</div>`;
}
function block(title, xs, f) {
  return `<details ${title.startsWith("Задачи") && xs.length ? "open" : ""}><summary>${title} · ${xs.length}</summary>${items(xs, f)}</details>`;
}
function mod(m) {
  const c = (n, label) => n ? `<span class="pill">${label} ${n}</span>` : "";
  return `<div class="mod"><div class="mod-head"><b>${esc(m.name)}</b><code>${esc(m.dir)}/_ctx.md</code><span class="spacer"></span>
    <span class="pill st-${esc(m.status.replace(" ", "-"))}">${esc(m.status)}</span></div>
    <div class="purpose">${esc(m.purpose)}</div>
    <div class="counts">${c(m.tasks.length, "задач")}${c(m.open.length, "❓")}${c(m.waiting.length, "⏳")}${c(m.seals.length, "Ъ")}${c(m.debt.length, "техдолг")}</div>
    ${block("Задачи", m.tasks, t => due(t) + esc(t.text))}
    ${block("Контракт", m.contract.map(x => x.replace(/^- /, "")), x => esc(x))}
    ${block("Инварианты", m.invariants)}${block("Печати", m.seals)}${block("Техдолг", m.debt)}
    ${block("Ждуны", m.waiting)}${block("Открыто", m.open)}${block("Не трогать", m.dont_touch)}</div>`;
}
function layers() {
  return `<div class="layers">${["ФРОНТЕНД", "БЭКЕНД"].map(L => `<div class="layer"><h3>${L}</h3>
    ${DATA.modules.filter(m => m.layer === L).map(mod).join("") || `<div class="empty">нет модулей</div>`}</div>`).join("")}</div>`;
}
function render() {
  const M = DATA.modules, chk = DATA.check;
  const reds = M.flatMap(m => m.tasks.filter(t => t.red).map(t => [m.dir, t]))
    .sort((a, b) => { const k = t => t.due.split(".").reverse().join(""); return k(a[1]) < k(b[1]) ? -1 : 1; });
  const badge = chk.errors.length ? `<span class="pill err">валидатор: ошибок ${chk.errors.length}</span>`
    : `<span class="pill ${chk.warnings.length ? "warn" : "ok"}">валидатор зелёный${chk.warnings.length ? `, предупреждений ${chk.warnings.length}` : ""}</span>`;
  document.getElementById("app").innerHTML = `
    <header><h1>${esc(DATA.project)}<small>канон</small></h1><span class="spacer"></span>${badge}</header>
    ${stepper()}<h2>Сводка</h2>${tiles()}
    <div class="two"><div><h2>🔴 Задачи со сроком</h2><div class="list">${rows(reds.map(([d, t]) => [d, due(t) + esc(t.text)]))}</div></div>
      <div><h2>❓ Открыто — нужен ответ</h2><div class="list">${rows(M.flatMap(m => m.open.map(x => [m.dir, esc(x)])))}</div></div></div>
    <h2>Модули</h2>${layers()}
    <div class="two"><div><h2>Архив · последнее</h2><div class="list">${rows(DATA.archive.map(a => [a.date + " " + a.module, esc(a.text)]))}</div></div>
      <div><h2>Валидатор</h2><div class="list">${rows([...chk.errors.map(e => ["ошибка", `<span class="msg err">${esc(e)}</span>`]),
        ...chk.warnings.map(w => ["внимание", `<span class="msg warn">${esc(w)}</span>`])])}</div></div></div>`;
}
render();
</script>
</body>
</html>
