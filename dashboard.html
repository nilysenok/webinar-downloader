<head>

<title>Канон проекта</title>
<!-- Собирается `python xtask.py` из md. Руками не править: правим _ctx.md и пересобираем. -->
<style>
:root { --bg:#f6f5f2; --surface:#fff; --surface-2:#efeee9; --border:#e2e0d9; --text:#1c1b19; --muted:#6e6b63; --faint:#a19d93;
  --accent:#e3262f; --accent-soft:#fbe3e4; --ok:#1f8a4c; --ok-soft:#dff2e6; --warn:#a86400; --warn-soft:#fbeed8; --err:#c0262d; --err-soft:#fbe3e4;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#131312; --surface:#1c1c1a; --surface-2:#262624; --border:#30302d;
  --text:#efede8; --muted:#9c9990; --faint:#6b6861; --accent:#ff4b53; --accent-soft:#3a1c1e; --ok:#4cc47f; --ok-soft:#173424;
  --warn:#e0a043; --warn-soft:#3a2c14; --err:#ff6b70; --err-soft:#3a1c1e; } }
:root[data-theme="dark"] { --bg:#131312; --surface:#1c1c1a; --surface-2:#262624; --border:#30302d; --text:#efede8; --muted:#9c9990; --faint:#6b6861;
  --accent:#ff4b53; --accent-soft:#3a1c1e; --ok:#4cc47f; --ok-soft:#173424; --warn:#e0a043; --warn-soft:#3a2c14; --err:#ff6b70; --err-soft:#3a1c1e; }
* { box-sizing:border-box; } html,body { margin:0; }
body { background:var(--bg); color:var(--text); font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:1180px; margin:0 auto; padding:28px 16px 64px; }
header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
h1 { font-size:21px; margin:0; letter-spacing:-.01em; } h1 small { color:var(--muted); font-weight:500; font-size:14px; margin-left:8px; }
.pill { font-size:12px; padding:2px 10px; border-radius:99px; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
.pill.ok { background:var(--ok-soft); color:var(--ok); } .pill.err { background:var(--err-soft); color:var(--err); } .pill.warn { background:var(--warn-soft); color:var(--warn); }
.spacer { flex:1; }
h2 { font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:26px 0 10px; font-weight:600; }
.stepper { display:flex; gap:0; margin-top:18px; overflow-x:auto; }
.st { flex:1; min-width:150px; padding:10px 12px 0 0; position:relative; }
.st::before { content:""; position:absolute; top:17px; left:16px; right:0; height:2px; background:var(--border); }
.st:last-child::before { display:none; }
.st .dot { width:16px; height:16px; border-radius:50%; background:var(--surface); border:2px solid var(--border); position:relative; z-index:1; }
.st.готово .dot { background:var(--ok); border-color:var(--ok); } .st.готово::before { background:var(--ok); }
.st.сейчас .dot { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
.st b { display:block; font-size:13.5px; margin-top:8px; } .st span { font-size:12.5px; color:var(--muted); }
.st.далее b { color:var(--muted); font-weight:500; }
.tiles { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.tile .k { font-size:12px; color:var(--muted); } .tile .v { font-size:24px; font-weight:650; font-family:var(--mono); letter-spacing:-.02em; }
.tile.hot .v { color:var(--err); }
.layers { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.layer h3 { font-size:13px; margin:0 0 8px; color:var(--muted); letter-spacing:.04em; }
.mod { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
.mod-head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; } .mod-head b { font-size:16px; }
.mod-head code { font-family:var(--mono); font-size:12px; color:var(--faint); }
.st-стабильно { background:var(--ok-soft); color:var(--ok); } .st-чинится { background:var(--err-soft); color:var(--err); }
.st-в-работе { background:var(--warn-soft); color:var(--warn); }
.purpose { color:var(--muted); margin:6px 0 10px; }
.counts { display:flex; gap:6px; flex-wrap:wrap; }
details { border-top:1px solid var(--border); margin-top:10px; padding-top:8px; }
summary { cursor:pointer; font-size:13px; color:var(--muted); user-select:none; }
ul { margin:6px 0 0; padding-left:18px; } li { margin:3px 0; }
code { font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:0 4px; border-radius:4px; }
.due { font-family:var(--mono); font-size:12px; padding:0 6px; border-radius:6px; background:var(--surface-2); margin-right:6px; }
.due.late { background:var(--err-soft); color:var(--err); }
.list { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:4px 16px; }
.row { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:baseline; }
.row:last-child { border-bottom:0; }
.row .m { font-family:var(--mono); font-size:12px; color:var(--muted); min-width:84px; }
.empty { color:var(--faint); padding:10px 0; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.msg.err { color:var(--err); } .msg.warn { color:var(--warn); }
@media (max-width:820px) { .tiles { grid-template-columns:repeat(3,1fr); } .layers, .two { grid-template-columns:1fr; } }
</style>

const DATA = {"project": "MTS Link загрузчик", "stages": [{"n": 1, "state": "готово", "title": "Аудио из CLI", "desc": "первая выгрузка MP3 вебинара, сведение 18 дорожек"}, {"n": 2, "state": "готово", "title": "Дашборд загрузок", "desc": "FastAPI + UI, режимы аудио/видео, история, докачка"}, {"n": 3, "state": "готово", "title": "Канон и проверка", "desc": "xtask, тесты, раскладка папок, git + приватный GitHub"}, {"n": 4, "state": "готово", "title": "Скорость загрузки", "desc": "замеры: потоки, HTTP/2, IP, рендишны; порог ≥1,5× к 2 МБ/с"}, {"n": 5, "state": "готово", "title": "webinarip · core + cli", "desc": "Rust, одно аудио, сравнение с Python; стоп и показ владельцу"}, {"n": 6, "state": "готово", "title": "webinarip · server + ui", "desc": "`serve`, встроенный интерфейс, первый звук через 1–2 с"}, {"n": 7, "state": "готово", "title": "webinarip · видео, дорожки, мультикам", "desc": "WebM без перекодирования, .m4a участников, FCPXML/EDL"}, {"n": 8, "state": "готово", "title": "webinarip · релиз v0.1.0", "desc": "README ru/en, бенчмарк, CI cargo-dist, публикация под nilysenok"}, {"n": 9, "state": "сейчас", "title": "webinarip · стенограмма с именами спикеров", "desc": "каждая дорожка = человек, mlx-whisper на Apple Silicon; сначала разведка и план с критерием остановки; в тестах и README только демо-имена"}], "modules": [{"name": "downloader", "dir": "downloader", "layer": "БЭКЕНД", "purpose": "Скачивает запись вебинара MTS Link в режиме «только аудио» (MP3), «видео + аудио» или «только видео» (MP4) и складывает итог в папку загрузки. Не знает про HTTP-сервер и UI.", "contract": ["- `Job(url, mode, quality, streams, workers)` + `await run(job)` — выполняет задачу; наружу не бросает, итог в `job.status / error / outputs / log`", "- статусы: `queued → meta → download → mix → mux → done | error | cancelled | interrupted`", "- `await analyze(client, url)` → `{sid, title, date, duration, tracks}`; у дорожки `variants`, `has_audio`, `kind`", "- `job_folder(job)` → `downloads/ГГГГ-ММ-ДД_ЧЧММ <название>/`, промежуточные — `job.work` = `…/_work/`", "- `job.cancel = True` — мягкая отмена: воркеры и ffmpeg останавливаются, сегменты остаются", "- CLI: `.venv/bin/python -m downloader.cli <ссылка> [--mode audio|av|video] [--quality best|480] [--workers 64]`", "- вход API MTS Link: `GET /api/eventsessions/<id>/record?withoutCuts=false` (открытые записи — без авторизации)"], "status": "в работе", "invariants": ["качаются только нужные HLS-рендишны (аудио `a1/…`, видео — вариант по качеству); mp4 целиком не качается", "сегмент пишется через `.part` + rename — недокачанный файл никогда не лежит под финальным именем", "перезапуск той же задачи не качает сегменты, уже лежащие в `_work/`", "видео не перекодируется (`-c copy`); в режиме av звук — кусок общего микса с `relativeTime` потока", "ffmpeg пишет во временный `*.part.*`; при сбое/отмене он удаляется", "`run()` никогда не бросает исключений наружу"], "tasks": [{"red": false, "due": "", "text": "потоков по умолчанию 64 → 256 (`config.DEFAULT_WORKERS`): ×1,9 к 64 потокам, ×2,4 к 2 МБ/с (замер 25.09) — ждёт «да», см. ОТКРЫТО"}, {"red": false, "due": "", "text": "потолок `MAX_WORKERS` 256 оставить: 384 даёт 20% таймаутов, 512 — обрыв (замер 25.09)"}, {"red": false, "due": "", "text": "e2e «Видео + аудио» на длинном потоке: проверить синхрон звука и видео (ffprobe + глазами)"}, {"red": false, "due": "", "text": "проверить определение экрана (`kind=screen`) на записи с демонстрацией экрана"}, {"red": false, "due": "", "text": "проверить отмену на этапе сведения (ffmpeg terminate) и повторный запуск после неё"}, {"red": false, "due": "", "text": "подпись качества в имени файла брать из реального кадра (ffprobe), а не из RESOLUTION плейлиста"}, {"red": false, "due": "", "text": "тест конвейера `_plan`/докачки на фейковом HTTP-сервере (сейчас проверено только вживую)"}], "debt": ["определение экрана — эвристика по модулю `screensharing*` в eventLogs; в тестовой записи экрана не было, проверить не на ize=0` и `adelay=…:all=1` — без них тихий звук или сдвиг только левого канала", "`pipeline._drain`: запись сегмента через `.part` + `replace` — на этом держится докачка", "`pipeline.job_folder`: если `job.folder` уже задан, он возвращается как есть — иначе перезапуск уедет в новую папку и докачка сломается"]}, {"name": "rust-cli", "dir": "rust-cli", "layer": "БЭКЕНД", "purpose": "Бинарник `webinarip` публичного проекта `../webinarip/cli`: разбор аргументов, прогресс-бары, итоговая статистика.", "contract": ["- `webinarip <ссылка> [--audio] [--from T] [--to T] [--tracks host,3,5] [--quality high|low] [--opus|--aac|--wav] [--out DIR] [--connections N≤256] [--session-id ID] [--cache-dir DIR] [--list]`", "- время: `75`, `01:15` (мм:сс, как в ffmpeg), `1:02:03`, `1h2m3s`", "- итог: путь, длительность, размер, время загрузки и сведения, p50/p99 сегмента, повторы, хеджи, 429", "- `WEBINARIP_TRACE=1` — строка прогресса в stderr раз в 5 с (для логов без терминала)", "- `--video` (WebM участников с общим звуком), `--both` (+ файл звука), `--separate` (.m4a участников), `--multicam` (FCPXML + EDL, включает --separate), `--mp4` (ffmpeg, предупреждение), `--video-height N`", "- без `--tracks` видео берётся у дорожек длиннее 30 с (переподключения по несколько секунд пропускаются)"], "status": "в работе", "invariants": ["код возврата 1 и одна строка `error: …` при любой ошибке"], "tasks": [{"red": false, "due": "", "text": "Ctrl+C: аккуратно остановить загрузку, сообщить, что кэш сохранён"}], "debt": [], "seals": ["Ъ — время в `--from/--to`: два числа = `мм:сс` (как ffmpeg и yt-dlp); для часов — `чч:мм:сс` или `1h20m` (25.09)"], "waiting": [], "open": [], "dont_touch": []}, {"name": "rust-core", "dir": "rust-core", "layer": "БЭКЕНД", "purpose": "Библиотека `webinarip-core` публичного проекта `../webinarip/core` (github nilysenok/webinarip, MIT): метаданные записи, HLS, загрузчик, кэш, потоковый микшер, кодировщики. Чистый Rust, кроме статически вшитого LAME.", "contract": ["- виде const esc0 = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esc = s => esc0(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const today = new Date();
function late(ddmm) {
  if (!ddmm) return false;
  const [d, m] = ddmm.split(".").map(Number);
  return new Date(today.getFullYear(), m - 1, d, 23, 59) < today;
}
const due = t => t.due ? `<span class="due ${late(t.due) ? "late" : ""}">${t.red ? "🔴 " : ""}${t.due}</span>` : "";

const rows = (xs) => xs.length ? xs.map(([m, html]) => `<div class="row"><span class="m">${esc(m)}</span><span>${html}</span></div>`).join("") : `<div class="empty">—</div>`;

function stepper() {
  return `<div class="stepper">${DATA.stages.map(s => `<div class="st ${s.state}"><div class="dot"></div>
    <b>${s.n}. ${esc(s.title)}</b><span>${esc(s.desc)}</span></div>`).join("")}</div>`;
}
function tiles() {
  const M = DATA.modules, all = f => M.flatMap(f);
  const reds = all(m => m.tasks.filter(t => t.red)), lateN = reds.filter(t => late(t.due)).length;
  const t = (k, v, hot) => `<div class="tile ${hot ? "hot" : ""}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="tiles">${t("Модулей", M.length)}${t("Задач", all(m => m.tasks).length)}
    ${t("🔴 со сроком" + (lateN ? `, просрочено ${lateN}` : ""), reds.length, lateN)}${t("❓ открыто", all(m => m.open).length, all(m => m.open).length)}
    ${t("⏳ ждуны", all(m => m.waiting).length)}${t("Ъ печатей", all(m => m.seals).length)}</div>`;
}
function block(title, xs, f) {
  return `<details ${title.startsWith("Задачи") && xs.length ? "open" : ""}><summary>${title} · ${xs.length}</summary>${items(xs, f)}</details>`;
}
function mod(m) {

}
function layers() {

function render() {

}
