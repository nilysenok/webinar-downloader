<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Канон проекта</title>
<!-- Собирается `python xtask.py` из md. Руками не править: правим _ctx.md и пересобираем. -->
<style>
:root { --bg:#f6f5f2; --surface:#fff; --surface-2:#efeee9; --border:#e2e0d9; --text:#1c1b19; --muted:#6e6b63; --faint:#a19d93;
  --accent:#e3262f; --accent-soft:#fbe3e4; --ok:#1f8a4c; --ok-soft:#dff2e6; --warn:#a86400; --warn-soft:#fbeed8; --err:#c0262d; --err-soft:#fbe3e4;
  --mono:ui-monospace,"SF Mono",Menlo,monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#131312; --surface:#1c1c1a; --surface-2:#262624; --border:#30302d;
  --text:#efede8; --muted:#9c9990; --faint:#6b6861; --accent:#ff4b53; --accent-soft:#3a1c1e; --ok:#4cc47f; --ok-soft:#173424;
  --warn:#e0a043; --warn-soft:#3a2c14; --err:#ff6b70; --err-soft:#3a1c1e; } }
:root[data-theme="dark"] { --bg:#131312; --surface:#1c1c1a; --surface-2:#262624; --border:#30302d; --text:#efede8; --muted:#9c9990; --faint:#6b6861;
  --accent:#ff4b53; --accent-soft:#3a1c1e; --ok:#4cc47f; --ok-soft:#173424; --warn:#e0a043; --warn-soft:#3a2c14; --err:#ff6b70; --err-soft:#3a1c1e; }
* { box-sizing:border-box; } html,body { margin:0; }
body { background:var(--bg); color:var(--text); font:14.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
.wrap { max-width:1180px; margin:0 auto; padding:28px 16px 64px; }
header { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
h1 { font-size:21px; margin:0; letter-spacing:-.01em; } h1 small { color:var(--muted); font-weight:500; font-size:14px; margin-left:8px; }
.pill { font-size:12px; padding:2px 10px; border-radius:99px; background:var(--surface-2); color:var(--muted); white-space:nowrap; }
.pill.ok { background:var(--ok-soft); color:var(--ok); } .pill.err { background:var(--err-soft); color:var(--err); } .pill.warn { background:var(--warn-soft); color:var(--warn); }
.spacer { flex:1; }
h2 { font-size:12.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:26px 0 10px; font-weight:600; }
.stepper { display:flex; gap:0; margin-top:18px; overflow-x:auto; }
.st { flex:1; min-width:150px; padding:10px 12px 0 0; position:relative; }
.st::before { content:""; position:absolute; top:17px; left:16px; right:0; height:2px; background:var(--border); }
.st:last-child::before { display:none; }
.st .dot { width:16px; height:16px; border-radius:50%; background:var(--surface); border:2px solid var(--border); position:relative; z-index:1; }
.st.готово .dot { background:var(--ok); border-color:var(--ok); } .st.готово::before { background:var(--ok); }
.st.сейчас .dot { background:var(--accent); border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft); }
.st b { display:block; font-size:13.5px; margin-top:8px; } .st span { font-size:12.5px; color:var(--muted); }
.st.далее b { color:var(--muted); font-weight:500; }
.tiles { display:grid; grid-template-columns:repeat(6,1fr); gap:10px; }
.tile { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
.tile .k { font-size:12px; color:var(--muted); } .tile .v { font-size:24px; font-weight:650; font-family:var(--mono); letter-spacing:-.02em; }
.tile.hot .v { color:var(--err); }
.layers { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.layer h3 { font-size:13px; margin:0 0 8px; color:var(--muted); letter-spacing:.04em; }
.mod { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:12px; }
.mod-head { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; } .mod-head b { font-size:16px; }
.mod-head code { font-family:var(--mono); font-size:12px; color:var(--faint); }
.st-стабильно { background:var(--ok-soft); color:var(--ok); } .st-чинится { background:var(--err-soft); color:var(--err); }
.st-в-работе { background:var(--warn-soft); color:var(--warn); }
.purpose { color:var(--muted); margin:6px 0 10px; }
.counts { display:flex; gap:6px; flex-wrap:wrap; }
details { border-top:1px solid var(--border); margin-top:10px; padding-top:8px; }
summary { cursor:pointer; font-size:13px; color:var(--muted); user-select:none; }
ul { margin:6px 0 0; padding-left:18px; } li { margin:3px 0; }
code { font-family:var(--mono); font-size:.92em; background:var(--surface-2); padding:0 4px; border-radius:4px; }
.due { font-family:var(--mono); font-size:12px; padding:0 6px; border-radius:6px; background:var(--surface-2); margin-right:6px; }
.due.late { background:var(--err-soft); color:var(--err); }
.list { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:4px 16px; }
.row { display:flex; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); align-items:baseline; }
.row:last-child { border-bottom:0; }
.row .m { font-family:var(--mono); font-size:12px; color:var(--muted); min-width:84px; }
.empty { color:var(--faint); padding:10px 0; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
.msg.err { color:var(--err); } .msg.warn { color:var(--warn); }
@media (max-width:820px) { .tiles { grid-template-columns:repeat(3,1fr); } .layers, .two { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const DATA = /*__DATA__*/null;
const esc0 = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const esc = s => esc0(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const today = new Date();
function late(ddmm) {
  if (!ddmm) return false;
  const [d, m] = ddmm.split(".").map(Number);
  return new Date(today.getFullYear(), m - 1, d, 23, 59) < today;
}
const due = t => t.due ? `<span class="due ${late(t.due) ? "late" : ""}">${t.red ? "🔴 " : ""}${t.due}</span>` : "";
const items = (xs, f = esc) => xs.length ? `<ul>${xs.map(x => `<li>${f(x)}</li>`).join("")}</ul>` : `<div class="empty">—</div>`;
const rows = (xs) => xs.length ? xs.map(([m, html]) => `<div class="row"><span class="m">${esc(m)}</span><span>${html}</span></div>`).join("") : `<div class="empty">—</div>`;

function stepper() {
  return `<div class="stepper">${DATA.stages.map(s => `<div class="st ${s.state}"><div class="dot"></div>
    <b>${s.n}. ${esc(s.title)}</b><span>${esc(s.desc)}</span></div>`).join("")}</div>`;
}
function tiles() {
  const M = DATA.modules, all = f => M.flatMap(f);
  const reds = all(m => m.tasks.filter(t => t.red)), lateN = reds.filter(t => late(t.due)).length;
  const t = (k, v, hot) => `<div class="tile ${hot ? "hot" : ""}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
  return `<div class="tiles">${t("Модулей", M.length)}${t("Задач", all(m => m.tasks).length)}
    ${t("🔴 со сроком" + (lateN ? `, просрочено ${lateN}` : ""), reds.length, lateN)}${t("❓ открыто", all(m => m.open).length, all(m => m.open).length)}
    ${t("⏳ ждуны", all(m => m.waiting).length)}${t("Ъ печатей", all(m => m.seals).length)}</div>`;
}
function block(title, xs, f) {
  return `<details ${title.startsWith("Задачи") && xs.length ? "open" : ""}><summary>${title} · ${xs.length}</summary>${items(xs, f)}</details>`;
}
function mod(m) {
  const c = (n, label) => n ? `<span class="pill">${label} ${n}</span>` : "";
  return `<div class="mod"><div class="mod-head"><b>${esc(m.name)}</b><code>${esc(m.dir)}/_ctx.md</code><span class="spacer"></span>
    <span class="pill st-${esc(m.status.replace(" ", "-"))}">${esc(m.status)}</span></div>
    <div class="purpose">${esc(m.purpose)}</div>
    <div class="counts">${c(m.tasks.length, "задач")}${c(m.open.length, "❓")}${c(m.waiting.length, "⏳")}${c(m.seals.length, "Ъ")}${c(m.debt.length, "техдолг")}</div>
    ${block("Задачи", m.tasks, t => due(t) + esc(t.text))}
    ${block("Контракт", m.contract.map(x => x.replace(/^- /, "")), x => esc(x))}
    ${block("Инварианты", m.invariants)}${block("Печати", m.seals)}${block("Техдолг", m.debt)}
    ${block("Ждуны", m.waiting)}${block("Открыто", m.open)}${block("Не трогать", m.dont_touch)}</div>`;
}
function layers() {
  return `<div class="layers">${["ФРОНТЕНД", "БЭКЕНД"].map(L => `<div class="layer"><h3>${L}</h3>
    ${DATA.modules.filter(m => m.layer === L).map(mod).join("") || `<div class="empty">нет модулей</div>`}</div>`).join("")}</div>`;
}
function render() {
  const M = DATA.modules, chk = DATA.check;
  const reds = M.flatMap(m => m.tasks.filter(t => t.red).map(t => [m.dir, t]))
    .sort((a, b) => { const k = t => t.due.split(".").reverse().join(""); return k(a[1]) < k(b[1]) ? -1 : 1; });
  const badge = chk.errors.length ? `<span class="pill err">валидатор: ошибок ${chk.errors.length}</span>`
    : `<span class="pill ${chk.warnings.length ? "warn" : "ok"}">валидатор зелёный${chk.warnings.length ? `, предупреждений ${chk.warnings.length}` : ""}</span>`;
  document.getElementById("app").innerHTML = `
    <header><h1>${esc(DATA.project)}<small>канон</small></h1><span class="spacer"></span>${badge}</header>
    ${stepper()}<h2>Сводка</h2>${tiles()}
    <div class="two"><div><h2>🔴 Задачи со сроком</h2><div class="list">${rows(reds.map(([d, t]) => [d, due(t) + esc(t.text)]))}</div></div>
      <div><h2>❓ Открыто — нужен ответ</h2><div class="list">${rows(M.flatMap(m => m.open.map(x => [m.dir, esc(x)])))}</div></div></div>
    <h2>Модули</h2>${layers()}
    <div class="two"><div><h2>Архив · последнее</h2><div class="list">${rows(DATA.archive.map(a => [a.date + " " + a.module, esc(a.text)]))}</div></div>
      <div><h2>Валидатор</h2><div class="list">${rows([...chk.errors.map(e => ["ошибка", `<span class="msg err">${esc(e)}</span>`]),
        ...chk.warnings.map(w => ["внимание", `<span class="msg warn">${esc(w)}</span>`])])}</div></div></div>`;
}
render();
</script>
</body>
</html>
