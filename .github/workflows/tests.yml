name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ffmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

      # запуск «двойным кликом»: скрипт сам создаёт окружение, ставит зависимости и поднимает сервер
      - name: start.sh (Linux, macOS)
        if: runner.os != 'Windows'
        env: { PORT: "8799" }
        run: |
          rm -rf .venv
          ./start.sh > start.log 2>&1 &
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:8799/api/jobs && break; sleep 1; done
          cat start.log
          curl -sf http://127.0.0.1:8799/ | grep -q 'Скачать запись вебинара'
          curl -sf http://127.0.0.1:8799/api/jobs
      - name: start.bat (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env: { PORT: "8799" }
        run: |
          Remove-Item -Recurse -Force .venv -ErrorAction SilentlyContinue
          Start-Process cmd -ArgumentList '/c', 'start.bat > start.log 2>&1' -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..120) {
            try { Invoke-WebRequest http://127.0.0.1:8799/api/jobs -UseBasicParsing | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          Get-Content start.log
          if (-not $ok) { throw "сервер не поднялся" }
          $page = (Invoke-WebRequest http://127.0.0.1:8799/ -UseBasicParsing).Content
          if ($page -notmatch 'Скачать запись вебинара') { throw "не та страница" }
